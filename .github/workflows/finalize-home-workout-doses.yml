name: Finalize home workout doses

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/finalize_home_workout_doses.py"
      - ".github/workflows/finalize-home-workout-doses.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare patch integrity check
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/finalize_home_workout_doses.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("    '3 круга × 12 повторений',\n", "    'exercisePrescriptions.strength[index][levelId]',\n")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply final exercise prescriptions
        run: python scripts/finalize_home_workout_doses.py
      - name: Verify result
        run: |
          grep -q "FINAL EXERCISE PRESCRIPTIONS" home-workout.html
          grep -q "const exercisePrescriptions=" home-workout.html
          grep -q "В каждом круге:" home-workout.html
          grep -q "Затем отдых до конца минуты" home-workout.html
          grep -q "Таймер силового блока" home-workout.html
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-workout.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Add exact exercise doses to home workouts"
            git push
          fi
