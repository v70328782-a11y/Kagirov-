name: Show Home Workout close only on home

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/show_close_only_on_home.py"
      - ".github/workflows/show-close-only-on-home.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/show_close_only_on_home.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home-workout.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Show Home Workout close button only on main screen"
            git push
          fi
