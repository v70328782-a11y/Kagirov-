name: Apply rank fullscreen

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/expand_on_rank.py"
      - ".github/workflows/apply-rank-fullscreen.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/expand_on_rank.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-workout.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Open Home Workout fullscreen on rank selection"
            git push
          fi
