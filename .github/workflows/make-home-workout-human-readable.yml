name: Make home workout human readable

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/make_home_workout_human_readable.py"
      - ".github/workflows/make-home-workout-human-readable.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply clear workout wording
        run: python scripts/make_home_workout_human_readable.py
      - name: Verify clear instructions
        run: |
          grep -q "HUMAN READABLE PROGRAM" home-workout.html
          grep -q "Как проходить тренировку" home-workout.html
          grep -q "Сколько сделать" home-workout.html
          grep -q "Кардио по минутам" home-workout.html
          grep -q "Делать, секунд" home-workout.html
          ! grep -q "Лимит:" home-workout.html
          ! grep -q "EMOM ·" home-workout.html
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-workout.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Make home workout instructions human readable"
            git push
          fi
