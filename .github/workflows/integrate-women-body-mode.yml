name: Integrate women BODY MODE
on:
  push:
    branches: ["main"]
    paths:
      - "scripts/integrate_women_body_mode.py"
      - ".github/workflows/integrate-women-body-mode.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply integration
        run: python scripts/integrate_women_body_mode.py
      - name: Verify
        run: |
          grep -q 'data-view="women"' index.html
          grep -q 'data-view-target="women"' index.html
          grep -q 'women-body-mode.html?v=1' index.html
          ! grep -q 'id="coralPop"' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Add women BODY MODE and remove Coral entry popup"
            git push
          fi
