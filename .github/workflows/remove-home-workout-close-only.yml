name: Remove Home Workout close button only

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/remove_home_workout_close_only.py"
      - ".github/workflows/remove-home-workout-close-only.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove close button only
        run: python scripts/remove_home_workout_close_only.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home-workout.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Remove Home Workout close button"
            git push
          fi
