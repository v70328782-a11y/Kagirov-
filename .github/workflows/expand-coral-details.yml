name: Expand Coral details
on:
  push:
    branches: ["main"]
    paths:
      - "scripts/expand_coral_details.py"
      - ".github/workflows/expand-coral-details.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/expand_coral_details.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git diff --cached --quiet || (git commit -m "Expand Coral Club advertising details" && git push)
