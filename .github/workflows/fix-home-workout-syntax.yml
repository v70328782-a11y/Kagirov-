name: Fix and validate home workout syntax

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/fix_home_workout_syntax.py"
      - ".github/workflows/fix-home-workout-syntax.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix generated syntax
        run: python scripts/fix_home_workout_syntax.py
      - name: Validate every script block
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          html = Path('home-workout.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No script blocks found')

          for index, source in enumerate(scripts, 1):
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as tmp:
                  tmp.write(source)
                  name = tmp.name
              result = subprocess.run(['node', '--check', name], text=True, capture_output=True)
              if result.returncode:
                  print(f'Script block {index} failed syntax validation')
                  print(result.stdout)
                  print(result.stderr)
                  raise SystemExit(result.returncode)
          print(f'Validated {len(scripts)} script blocks')
          PY
      - name: Verify visible wording
        run: |
          grep -q "Подходы" home-workout.html
          grep -q "Сколько сделать" home-workout.html
          grep -q "Отдых" home-workout.html
          grep -q "Кардио по минутам" home-workout.html
          ! grep -q "Лимит:" home-workout.html
          ! grep -q "EMOM ·" home-workout.html
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-workout.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Fix and validate human-readable home workout"
            git push
          fi
