name: Apply Home Workout integration

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/add_home_workout_nav.py"
      - ".github/workflows/apply-home-workout.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch main site
        run: python scripts/add_home_workout_nav.py

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Integrate Home Workout platform into navigation"
            git push
          fi
