name: Fix rank close flash

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/fix_rank_close_flash.py"
      - ".github/workflows/fix-rank-close-flash.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_rank_close_flash.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add index.html home-workout.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Hide close button on direct rank fullscreen"
            git push
          fi
