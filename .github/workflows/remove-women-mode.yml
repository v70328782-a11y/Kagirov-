name: Remove women mode
on:
  push:
    branches: ["main"]
    paths:
      - "scripts/remove_women_mode_everything.py"
      - ".github/workflows/remove-women-mode.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove women mode
        run: python scripts/remove_women_mode_everything.py
      - name: Verify removal
        run: |
          ! grep -qi 'data-view="women"' index.html
          ! grep -qi 'data-view-target="women"' index.html
          ! grep -qi 'women-body-mode.html' index.html
          test ! -f women-body-mode.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Remove women mode completely"
            git push
          fi
