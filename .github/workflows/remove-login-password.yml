name: Remove login password

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/remove_login_password.py"
      - ".github/workflows/remove-login-password.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/remove_login_password.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Remove login password screen"
            git push
          fi
