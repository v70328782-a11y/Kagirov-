name: Apply password site update

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-auth-update.yml"

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply requested index update
        run: python .github/scripts/apply_auth_update.py

      - name: Commit updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Publish password-protected Kagirov site"
            git push
          fi
