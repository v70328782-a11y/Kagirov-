name: Enable maintenance mode
on:
  push:
    branches: ["main"]
    paths:
      - "scripts/enable_maintenance_mode.py"
      - ".github/workflows/enable-maintenance-mode.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply maintenance lock
        run: python scripts/enable_maintenance_mode.py
      - name: Verify
        run: |
          grep -q 'id="maintenanceScreen"' index.html
          grep -q '2 часа 30 минут' index.html
          grep -q 'class="maintenance-locked"' index.html
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Enable maintenance mode"
            git push
          fi
